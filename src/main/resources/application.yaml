spring:
  application:
    name: oi
  profiles:
    # Default to dev profile; override with --spring.profiles.active=prod in production.
    default: dev
  autoconfigure:
    # The starter's own registration has a broken ordering hint on Boot 4 (Boot 3 package
    # reference); it is re-registered with correct ordering by DataSourceDecoratorBoot4CompatAutoConfiguration.
    exclude: com.github.gavlyukovskiy.boot.jdbc.decorator.DataSourceDecoratorAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/oi;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 120000
      auto-commit: true
      pool-name: HikariCP
      keepalive-time: 60000
  data:
    # Redis 连接配置：Redisson 客户端（redisson-spring-boot-starter）据此建立连接，
    # 同时作为 Spring Data Redis 的连接工厂（RedisTemplate 复用同一连接）。
    # 生产环境通过环境变量覆盖，禁止在配置文件中明文写入口令。
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data.sql
  servlet:
    multipart:
      # 文件上传报文硬上限（统一文件服务的业务级大小限制见 file.upload.max-size）
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    # 序列化时区（java.util.Date 等带时区类型）；应用默认时区见 OiApplication（东八区）
    time-zone: Asia/Shanghai

logging:
  charset:
    console: utf-8
    file: utf-8
  pattern:
    console: '%red(%d{HH:mm:ss}) %green([%thread]) %highlight(%-5level) %boldMagenta(%logger%n) - %msg%n'
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger%n - %msg%n"
  level:
    root: info
  file:
    name: logs/${spring.application.name:oi}.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/${spring.application.name:oi}.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 100

# 任务调度模块配置（cn.sijay.oi.sys.job；任务定义存库可在线改，无需重启）
oi:
  job:
    scheduler:
      # 调度触发线程池大小：仅承载"到点触发"，不承载业务执行（执行在引擎工作线程池）
      # 按实例任务规模调整；1000 并发任务场景默认值已足够
      pool-size: 8

# 统一文件管理服务配置（调用规范见 docs/file/README.md；业务模块只存文件 id，禁止存 URL/路径）
file:
  upload:
    # 全局默认扩展名白名单（小写、不含点）；纯图片业务可用 FileService.uploadImage 收窄为图片白名单
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,txt,doc,docx,xls,xlsx,ppt,pptx,zip,rar,7z
    # 单文件大小上限（multipart 硬上限之内）
    max-size: 10MB
  access:
    # 访问地址签名密钥（HMAC-SHA256）；生产环境务必更换为随机高熵值
    secret: oi-file-access-secret
    # 访问地址默认有效期（分钟）
    ttl-minutes: 30

# sa-token 登录认证配置（全局鉴权规则见 cn.sijay.oi.common.config.SaTokenConfigure）
sa-token:
  # 令牌名称（请求头/Cookie 参数名），前端登录后携带该请求头访问受保护接口
  token-name: satoken
  # 令牌有效期（秒）：30 天
  timeout: 2592000
  # 临时活跃超时（秒）：-1 表示不校验活跃冻结
  active-timeout: -1
  # 允许同一账号并发登录
  is-concurrent: true
  # 并发登录共享同一令牌
  is-share: true
  # 令牌风格：UUID
  token-style: uuid
  # 关闭框架级日志打印
  is-log: false
server:
  port: 29979
